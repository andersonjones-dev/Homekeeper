<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HomeKeeper</title>
<meta name="theme-color" content="#F7F6F0">
<script>
/* Set the theme before anything is drawn, so the status bar area is the right colour from the very first paint. */
(function(){try{var p=JSON.parse(localStorage.getItem('hk2.prefs.v1')||'{}');var t=p.theme||'auto';var d=t==='dark'||(t==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light');var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',d?'#121815':'#F7F6F0');}catch(e){}})();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HomeKeeper">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" href="../icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app"></div>
<script>
// Shows the real error on screen if the app cannot start.
(function(){
  var sizes={"js/util.js":0,"js/store.js":0,"js/parser.js":0,"js/calendar.js":0,"js/notify.js":0,"js/sync.js":0,"js/delight.js":0,"js/ui.js":0,"js/screens.js":0,"js/voice.js":0,"js/app.js":0,"css/app.css":0};
  function show(msg){var a=document.getElementById('app');if(!a)return;var d=document.createElement('div');d.style.cssText='padding:24px 20px;font:14px/1.5 -apple-system,system-ui,sans-serif;color:#24312C;word-break:break-word';d.setAttribute('data-boot-error','1');d.textContent=msg;a.appendChild(d);}
  window.__bootErr=[];
  window.addEventListener('error',function(e){window.__bootErr.push(e.message);});
  window.__bootCheck=function(reason){
    var out=['HomeKeeper could not start.','Reason: '+reason,''];
    var keys=Object.keys(sizes);var i=0;
    (function next(){
      if(i>=keys.length){show(out.join('\n'));return;}
      var k=keys[i++];
      fetch(k+'?v='+Date.now(),{cache:'no-store'}).then(function(r){
        if(!r.ok){out.push(k+': NOT FOUND ('+r.status+')');return null;}
        return r.arrayBuffer().then(function(b){if(b.byteLength===0)out.push(k+': file is empty');});
      }).catch(function(e){out.push(k+': '+e);}).then(next);
    })();
  };
})();
</script>

<noscript>HomeKeeper needs JavaScript.</noscript>
<script type="module">
// The older HomeKeeper site has its own service worker that covers this folder and can serve stale files.
// Take over this folder with our own worker first, then start the app.
async function takeOver(){
  if(!('serviceWorker' in navigator))return;
  try{
    await navigator.serviceWorker.register('./sw.js',{scope:'./'});
    await navigator.serviceWorker.ready;
    var ours=function(){var c=navigator.serviceWorker.controller;return c&&/\/v2\/sw\.js/.test(c.scriptURL);};
    if(!ours()){
      await new Promise(function(res){
        var t=setTimeout(res,2500);
        navigator.serviceWorker.addEventListener('controllerchange',function(){if(ours()){clearTimeout(t);res();}});
      });
    }
  }catch(e){}
}
takeOver().then(function(){return import('./js/app.js');}).catch(function(e){window.__bootCheck(String(e&&e.message||e));});
</script>
</body>
</html>
